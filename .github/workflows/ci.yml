name: ci

on:
  push:
  pull_request:
  # (the release runs it first: nothing is built for a release before the
  # gate and the tests pass)
  workflow_call:

permissions:
  contents: read

jobs:
  # Before anything is built (a build runs the crates' build scripts and
  # proc macros): axross's supply-chain gate on Cargo.lock - every crate from
  # crates.io with the checksum it publishes, not yanked, at least 14 days
  # old, no RustSec / OSV advisory (OSV must answer), no typo of a popular
  # name, and its .crate the one reviewed in security/cargo_baseline/ (build
  # scripts, proc macros, binaries, findings); then the same with GuardDog's
  # and axross's YARA rules, from the scanners' hashed lock that axross's
  # PyPI gate checks first. (As axross-amp's.)
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: axross's gate, its scanners' lock and their reviewed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: c0decave/axross
          # (pinned by commit: the gate's security/supply_chain_cargo.py as
          # axross 0.15.180 has it)
          ref: cd0cac8032f6d612af390c344f8b998df086efb9
          path: .axross
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /security/
            /build/requirements-scan-tools.txt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Downloads and crates.io's answers of earlier runs (by checksum; nothing is trusted from it unchecked)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/supply-chain-cache
          key: supply-chain-${{ hashFiles('Cargo.lock') }}
          restore-keys: supply-chain-
      - name: Gate (crates.io, RustSec and OSV, age, names, content against the baseline)
        run: python -I .axross/security/supply_chain_cargo.py --config security/supply-chain-cargo.toml check --require-osv --report supply-chain-report
      - name: The scanners, checked by axross's PyPI gate, then installed by hash
        run: |
          python -I .axross/security/supply_chain_gate.py --config security/scan-tools-gate.toml check --reduced-locks "$RUNNER_TEMP/reduced"
          python -m venv "$RUNNER_TEMP/scan-venv"
          "$RUNNER_TEMP/scan-venv/bin/pip" install -q --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/reduced/requirements-scan-tools.txt"
          python -I .axross/security/supply_chain_gate.py --config security/scan-tools-gate.toml verify-env --python "$RUNNER_TEMP/scan-venv/bin/python" --lock .axross/build/requirements-scan-tools.txt
      - name: Gate with the scanners (YARA over every member)
        run: python -I .axross/security/supply_chain_cargo.py --config security/supply-chain-cargo.toml check --require-osv --scan-python "$RUNNER_TEMP/scan-venv/bin/python" --report supply-chain-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-report
          path: supply-chain-report
          if-no-files-found: ignore

  test:
    needs: supply-chain
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.100.0 (rustup, with clippy and rustfmt)
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt && rustup default 1.100.0
      # (the screenshot and flash tests render with Mesa's software Vulkan,
      # lavapipe; winit loads the X libraries by name)
      - name: Linux libraries (Mesa's software Vulkan, Xvfb and the X libraries)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 fonts-noto-cjk fonts-noto-core fonts-symbola
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # (every test binary run, also past a failing one; each failure an
      # annotation of its own)
      - name: Tests (the pictures render with lavapipe on Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          AFM_REQUIRE_GPU: "1"
          # (the names in every script must be drawn, with the fonts above)
          AFM_REQUIRE_FONTS: "1"
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee target/test-output.log \
            || { python3 scripts/test_failures.py target/test-output.log; exit 1; }
      - name: "Tests (no GPU on these runners: the picture tests are skipped)"
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          PYTHON=$(command -v python3 || command -v python)
          cargo test --no-fail-fast --lib --bins 2>&1 | tee target/test-output.log \
            || { "$PYTHON" scripts/test_failures.py target/test-output.log; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-output-${{ runner.os }}
          path: |
            target/test-output.log
            tests/snapshots/*.new.png
            tests/snapshots/*.diff.png
          if-no-files-found: ignore
      - run: cargo build --release
      - name: On Windows a GUI program (no console window beside it)
        if: runner.os == 'Windows'
        run: python scripts/pe_subsystem.py target/release/axross-files-matrix.exe gui
      - name: The release binary starts (--version, --self-test, --dump-city)
        shell: bash
        run: |
          EXE=target/release/axross-files-matrix
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --version
          "$EXE" --dump-city src --depth 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axross-files-matrix-${{ runner.os }}
          path: |
            target/release/axross-files-matrix
            target/release/axross-files-matrix.exe
          if-no-files-found: ignore
